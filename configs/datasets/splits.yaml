# Split metadata generated by experiments/build_splits.py.
# Run that script (default seed=0) before any experiment; consumers
# read outputs/splits/{train,dev,test,smoke}.json.

policy:
  # Source datasets per split
  train:  { dataset: musdb18, source_split: train }
  dev:    { dataset: musdb18, source_split: test, half: first  }
  test:   { dataset: musdb18, source_split: test, half: second }
  smoke:  { dataset: medleydb, root: $MEDLEYDB_SAMPLE_ROOT }

  # Stratification rule
  tier_balanced: true       # split per-tier 50/50
  tier_C_to_test: true      # the single Tier-C song goes to TEST

  # Reproducibility
  default_seed: 0

# Use:
#   python3 experiments/run_e1_resolution_scope.py \
#       --dataset musdb18 --split test ...
# enumerate_split("test", tiers=["A","B","C"]) returns the test set.
