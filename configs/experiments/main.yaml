# Hydra config — main orchestrator run
defaults:
  - /agent: claude_opus
  - /ears: tier1_mos
  - _self_

run_name: main
seed: 42
target_lufs: -14.0       # streaming target
max_iterations: 20
history_window: 8
patience: 3
min_delta: 0.02          # min reward improvement at target resolution
epsilon: 0.005           # tolerance for non-target resolutions

dataset:
  name: synthetic        # smoke uses synthetic; switch to medleydb later
  song_id: null
  sample_rate: 44100

resolutions: ["global", "section", "short_term", "momentary"]

output_dir: ${oc.env:MIXORCH_RUNS_DIR,outputs/runs}/${run_name}
cache_dir: ${oc.env:MIXORCH_CACHE_DIR,outputs/cache}

budget:
  max_usd_per_run: ${oc.env:MIXORCH_BUDGET_USD_PER_RUN,2.0}
  max_usd_total:   ${oc.env:MIXORCH_BUDGET_USD_TOTAL,50.0}

wandb:
  enabled: true
  project: mix-orchestrator
  entity: null
  mode: online           # offline / disabled allowed
